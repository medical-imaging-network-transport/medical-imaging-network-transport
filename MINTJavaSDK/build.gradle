
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.nema.medical'
version = '1.3'

repositories {
    mavenCentral()
}

configurations {
    jibxBinding
}

dependencies {
    implementation (
            [group: 'com.google.protobuf', name: 'protobuf-java', version: '4.32.0'],
            [group: 'commons-codec', name: 'commons-codec', version: '1.6'],
            [group: 'joda-time', name: 'joda-time', version: '2.8.2'],
            [group: 'org.jibx', name: 'jibx-run', version: '1.4.2']
    )

    testImplementation (
            [group: 'junit', name: 'junit', version: '4.10']
    )

    jibxBinding (
            [group: 'org.jibx', name: 'jibx-bind', version: '1.4.2']
    )
}

java {
    withSourcesJar()
    withJavadocJar()
}

//Runs the Jibx bindings using an ant task
compileJava.doLast {
    def bindingDir = file("${project.projectDir}/src/main/jibx")
    def bindingClassPath = sourceSets.main.output.classesDirs.getSingleFile()
    ant {
        taskdef(
                name: 'bind',
                classname: 'org.jibx.binding.ant.CompileTask',
                classpath: configurations.jibxBinding.asPath
        )
        bind(
                verbose: 'true'
        ) {
            bindingfileset(dir: bindingDir) {
                include(name: '**/*.jibx')
            }
            classpath {
                pathelement(path: bindingClassPath)
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}